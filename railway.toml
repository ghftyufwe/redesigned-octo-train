[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
# Railway accepts exactly one pre-deploy entry and executes it directly rather
# than through a shell, so the two steps cannot be an array of two, and they
# cannot be chained with "&&" in a bare string either: node takes the "&&" and
# everything after it as extra argv and silently ignores it, which is how
# provision-runtime-roles stopped running while deploys stayed green and
# spr_worker_runtime's password drifted out of sync.
# "npm run release" is one entry, and npm runs its script through a shell, so
# the chain works. Both steps are idempotent.
preDeployCommand = ["npm run release"]
# /health is deliberately shallow -- it returns 200 on uptime alone and checks
# nothing. Pointing Railway at it meant the platform kept routing traffic to an
# application that was telling anyone who asked that it was NOT ready: production
# served 503 from /ready with {"tenantRls":{"ok":false}} for hours while the
# deployment showed healthy, which is how the intake RLS gap went unnoticed.
#
# /ready is the deep probe: database reachability plus spr_assert_tenant_rls().
# Verified to fail closed before this switch was made -- with the database
# unreachable /health still answers 200 while /ready answers 503
# {"database":{"ok":false,"error":"DATABASE_UNAVAILABLE"}}, so a dependency
# failure now fails the deployment instead of being declared healthy.
healthcheckPath = "/ready"
healthcheckTimeout = 180
restartPolicyType = "ALWAYS"
